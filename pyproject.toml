[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vindicta-engine"
version = "0.1.0"
description = "Physics, Dice, and AI Core for the Vindicta Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Not on PyPI. A direct reference works for pip and uv alike; pinned to a commit, bump deliberately.
    "vindicta-foundation @ git+https://github.com/vindicta-platform/vindicta-foundation@1dfed5c92ef87f8ad42f12bc41dfc588e27cbcf2",
    "numpy>=1.26.0",
    "langgraph>=1.0.8",
    "behave>=1.3.3",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vindicta_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
strict = true
python_version = "3.12"

# vindicta-foundation ships no py.typed marker yet, so mypy would treat its classes as Any.
[[tool.mypy.overrides]]
module = ["vindicta_foundation.*"]
follow_untyped_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=vindicta_engine --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest-sugar>=1.1.1",
    "pytest-cov>=6.0.0",
    "behave>=1.2.6",
    "pytest-xdist>=3.5.0",
]

[tool.coverage.run]
source = ["src/vindicta_engine"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
