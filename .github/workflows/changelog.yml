name: Changelog

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    uses: vindicta-platform/.github/.github/workflows/changelog-template.yml@b25991df3c05c3faa4a1376ba206492f8b2ad504 # main
    permissions:
      contents: write
