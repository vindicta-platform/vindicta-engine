name: Auto-Merge PR

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-merge:
    uses: vindicta-platform/.github/.github/workflows/auto-merge-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      pull-requests: write
      contents: write
