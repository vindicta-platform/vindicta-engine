name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  draft:
    uses: vindicta-platform/.github/.github/workflows/release-drafter-template.yml@b25991df3c05c3faa4a1376ba206492f8b2ad504 # main
    permissions:
      contents: write
      pull-requests: read
