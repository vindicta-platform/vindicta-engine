name: CODEOWNERS Validator

on:
  pull_request:
    branches: [main]
    paths:
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
  workflow_dispatch:

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: vindicta-platform/.github/.github/workflows/codeowners-validator-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: read
