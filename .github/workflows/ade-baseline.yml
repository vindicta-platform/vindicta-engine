name: ADE baseline (report only)

# Plan task E1.2: run First-ADE's compliance checker against this repository as it stands
# and keep the report as evidence. Report-only: findings never fail this job.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.ade-compliance.yml'
      - '.github/workflows/ade-baseline.yml'
  push:
    branches: [main]
    paths:
      - '.ade-compliance.yml'
      - '.github/workflows/ade-baseline.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: ade-compliance check-all (audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install ade-compliance at a pinned commit
        run: |
          pip install --only-binary :all: --no-binary ade-compliance "ade-compliance @ git+https://github.com/First-ADE/first-ade@2344f99f67cd580dbadbc0083f0465a95979c267"
      - name: Run the checker
        run: |
          set +e
          mkdir -p evidence-out
          printf '%s\n' "$(git rev-parse HEAD)" > evidence-out/commit.txt
          ade-compliance check-all src tests > evidence-out/summary.txt 2> evidence-out/stderr.txt
          echo "check-all exit=$?" >> evidence-out/exit.txt
          ade-compliance generate-report src tests > evidence-out/report.json 2>> evidence-out/stderr.txt
          echo "generate-report exit=$?" >> evidence-out/exit.txt
          cat evidence-out/summary.txt evidence-out/exit.txt
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ade-baseline
          path: evidence-out/
          if-no-files-found: error
