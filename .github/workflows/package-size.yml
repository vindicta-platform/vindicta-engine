name: Package Size

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  monitor:
    uses: vindicta-platform/.github/.github/workflows/package-size-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: read
