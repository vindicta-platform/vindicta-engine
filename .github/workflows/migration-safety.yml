name: Migration Safety

on:
  pull_request:
    branches: [main]
    paths:
      - '**/migrations/**'
      - '**/alembic/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: vindicta-platform/.github/.github/workflows/migration-safety-template.yml@b25991df3c05c3faa4a1376ba206492f8b2ad504 # main
    permissions:
      contents: read
