name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # No path filter here: "Pre-Commit Checks" and "Python Tests (3.12)" are required checks,
  # and a required check that never runs leaves the pull request blocked forever.
  pull_request:
    branches: [main, master]

jobs:
  ci:
    uses: vindicta-platform/.github/.github/workflows/ci-python-template.yml@main
    permissions:
      contents: read
      pull-requests: write
