name: Deprecation Tracker

on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    uses: vindicta-platform/.github/.github/workflows/deprecation-tracker-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: read
