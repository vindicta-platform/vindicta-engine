name: Coverage Report

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    uses: vindicta-platform/.github/.github/workflows/coverage-report-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: read
      pull-requests: write
