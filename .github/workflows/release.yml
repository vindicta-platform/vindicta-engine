name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: vindicta-platform/.github/.github/workflows/release-python-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: write
      packages: write
