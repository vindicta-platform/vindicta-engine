name: SAST Scanner

on:
  # No path filter here: "Static Analysis (Bandit)" is a required check, so it must report
  # on every pull request. The job itself skips quickly when there is no Python source.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

jobs:
  scan:
    uses: vindicta-platform/.github/.github/workflows/sast-scanner-template.yml@main
    permissions:
      contents: read
